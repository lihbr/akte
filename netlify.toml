[build]
	command = "npm run build --workspace docs"
	publish = "docs/dist"
	ignore  = "git diff --quiet HEAD^ HEAD ./docs ./package.json ./CHANGELOG.md ./netlify.toml"

[[headers]]
	for = "/assets/*"
	[headers.values]
		access-control-allow-origin = "*"

# Netlify domain
[[redirects]]
	from = "https://akte.netlify.app/*"
	to = "https://akte.js.org/:splat"
	status = 301
	force = true
